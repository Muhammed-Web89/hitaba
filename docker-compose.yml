# Üretime yakın yerel ortam (Docker kuruluysa). Geliştirmede `npm run db` (PGlite) yeterlidir.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hitaba
      POSTGRES_PASSWORD: hitaba
      POSTGRES_DB: hitaba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
