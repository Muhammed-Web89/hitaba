# Render ücretsiz planı 15 dk boşta kalan servisi uyutur; ilk açılış 30–60 sn sürer.
# Her 10 dakikada bir sağlık ucuna istek atılarak API uyanık tutulur (aylık 750 saat ücretsiz kotaya sığar).
name: API'yi uyanık tut

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://hitaba-api.onrender.com/health
